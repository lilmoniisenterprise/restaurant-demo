# One-off helper: downloads the Pexels photos listed in tools/photo-candidates.txt,
# resizes/compresses them, and commits them to photo-candidates/ so the site can self-host them.
name: Fetch photo candidates
on:
  workflow_dispatch:
  push:
    paths: ["tools/photo-candidates.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and optimize
        run: |
          sudo apt-get -qq install -y imagemagick >/dev/null
          mkdir -p photo-candidates
          for id in $(grep -v '^#' tools/photo-candidates.txt); do
            url="https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=1600"
            if curl -fsSL -A "Mozilla/5.0" "$url" -o "/tmp/$id.jpg"; then
              convert "/tmp/$id.jpg" -strip -resize '1600x1600>' -sampling-factor 4:2:0 -quality 80 -interlace JPEG "photo-candidates/$id.jpg"
              echo "ok $id $(identify -format '%wx%h' photo-candidates/$id.jpg)" >> photo-candidates/_log.txt
            else
              echo "FAIL $id" >> photo-candidates/_log.txt
            fi
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add photo-candidates
          git commit -m "Fetch photo candidates" || echo "nothing to commit"
          git push
